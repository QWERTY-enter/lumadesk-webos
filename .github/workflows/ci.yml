name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend and frontend tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-aiohttp python3-psutil

      - name: Run backend security tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Python and JavaScript syntax
        run: |
          python3 -m py_compile app/server.py
          node --check app/static/app.js

      - name: Check shell scripts
        run: |
          bash -n scripts/setup.sh scripts/maintenance.sh
          sh -n scripts/entrypoint.sh

  image:
    name: Build linux/amd64 image
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha,scope=lumadesk-amd64
          cache-to: type=gha,mode=max,scope=lumadesk-amd64
