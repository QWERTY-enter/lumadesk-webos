name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend and frontend tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-aiohttp python3-psutil

      - name: Run backend security tests
        run: python3 -m unittest discover -s tests -v

      - name: Check Python and JavaScript syntax
        run: |
          python3 -m py_compile app/server.py
          node --check app/static/app.js

      - name: Run frontend DOM smoke test
        run: |
          npm ci --no-audit --no-fund
          npm run test:frontend

      - name: Check shell scripts and entrypoint behavior
        run: |
          bash -n scripts/setup.sh scripts/maintenance.sh tests/test_entrypoint.sh
          sh -n scripts/entrypoint.sh scripts/healthcheck.sh
          bash tests/test_entrypoint.sh

  image:
    name: Build linux/amd64 image
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: lumadesk:test
          cache-from: type=gha,scope=lumadesk-amd64
          cache-to: type=gha,mode=max,scope=lumadesk-amd64

      - name: Smoke-test Railway compatibility mode
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs lumadesk-railway-smoke 2>/dev/null || true
            docker rm -f lumadesk-railway-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name lumadesk-railway-smoke \
            --env RAILWAY_PROJECT_ID=ci-smoke-test \
            --env PORT=18080 \
            --env 'WEBOS_PASSWORD=Railway7$' \
            --publish 18080:18080 \
            lumadesk:test
          for _ in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          health = json.load(open('/tmp/health.json', encoding='utf-8'))
          assert health['ok'] is True
          assert health['runtime'] == 'railway'
          PY
          test "$(docker exec lumadesk-railway-smoke cat /proc/1/comm)" != systemd
          test "$(docker exec lumadesk-railway-smoke sh -c 'wc -c < /var/lib/lumadesk/session-secret')" -ge 32
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"password":"Railway7$"}' \
            http://127.0.0.1:18080/api/login > /tmp/login.json
          python3 - <<'PY'
          import json
          result = json.load(open('/tmp/login.json', encoding='utf-8'))
          assert result['ok'] is True
          assert result['user'] == 'webos'
          PY
